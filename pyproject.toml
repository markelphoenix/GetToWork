[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gettowork"
version = "0.1.0"
description = "Get To Work: an edutainment text adventure that teaches local open-weight LLMs and the Jev typed-judgment API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "markelphoenix" }]
keywords = ["llm", "local-llm", "education", "game", "jev", "gguf", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Education",
]
dependencies = [
  "rich>=13.0",
  "psutil>=5.9",
  "huggingface_hub>=1.1",  # 1.1 added hf_hub_download(tqdm_class=...), which drives the download bar
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
gettowork = "gettowork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
