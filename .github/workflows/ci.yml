# Runs the test suite on every push and pull request, on Windows, macOS and
# Linux, with the oldest (3.10) and a recent (3.12) supported Python.
#
# The tests never touch the network, real models or real downloads (they use
# fakes), so this needs no secrets and no GPU.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Quoted on purpose: unquoted, YAML would read 3.10 as the number 3.1.
        python-version: ["3.10", "3.12"]
    env:
      # Belt and braces: even if a test forgot a fake, huggingface_hub stays offline.
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      # Consistent UTF-8 output on every OS (Windows consoles default to a code page).
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the game with its test tools
        # Just the dev extra: the optional llama-cpp-python backend isn't needed for tests.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the tests
        run: python -m pytest -q
